name: Revoke Database Entry

on:
  issue_comment:
    types:
      - created

jobs:
  process-revocation:
    runs-on: ubuntu-latest
    concurrency:
      group: db-file-lock
      cancel-in-progress: false
    if: >
      (github.event.comment.body == '/revoke' || 
       startsWith(github.event.comment.body, '/revoke ') || 
       startsWith(github.event.comment.body, ' /revoke')) &&
      contains(fromJson('["OWNER", "COLLABORATOR", "MEMBER"]'),
      github.event.comment.author_association)
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove entry from json database
        id: update_json
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python .github/scripts/revoke_entry.py

      - name: Commit Changes
        if: steps.update_json.outputs.action_result == 'revoked'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resources/db/showcased-sites.json
          git commit -m "Revoke showcase submission #${ISSUE_NUMBER}"
          git push

      - name: Comment on Issue without closing
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUCCESS_MSG: ${{ steps.update_json.outputs.success_msg }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "${SUCCESS_MSG}"

      - name: Comment on Error
        if: failure() && steps.update_json.outputs.error_msg != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERROR_MSG: ${{ steps.update_json.outputs.error_msg }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "❌ Revocation Failed. ${ERROR_MSG}"