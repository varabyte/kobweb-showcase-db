name: Submit New Entry
description: Submit a new entry to the database
title: "Submission: "
labels: ["submission", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to add a new entry.
  - type: input
    id: author-name
    attributes:
      label: Author Name
      description: "Who created this entry?"
      placeholder: "e.g., John Doe"
    validations:
      required: true
  - type: input
    id: entry-title
    attributes:
      label: Title
      description: "The name of the entry."
      placeholder: "e.g., My Awesome Project"
    validations:
      required: true
  - type: input
    id: entry-url
    attributes:
      label: URL
      description: "The primary link."
      placeholder: "e.g., https://example.com"
    validations:
      required: true
  - type: input
    id: image-url
    attributes:
      label: Image URL
      description: "Link to a preview image (Must be hosted on githubusercontent.com)"
      placeholder: "e.g., https://user-images.githubusercontent.com/.../image.png"
    validations:
      required: true
  - type: textarea
    id: entry-description
    attributes:
      label: Description
      description: "A short description."
    validations:
      required: true
  - type: input
    id: entry-tags
    attributes:
      label: Tags
      description: "Comma-separated tags."
      placeholder: "e.g., tag1, tag2, tag3"
    validations:
      required: false